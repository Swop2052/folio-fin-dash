[build]
  command = "bun run build"
  # Nitro's Netlify preset writes static assets to `dist` and the SSR
  # function to `.netlify/functions-internal`.
  publish = "dist"

[build.environment]
  # bun.lock (text lockfile) and bunfig `minimumReleaseAge` need a modern Bun.
  BUN_VERSION = "1.3.12"
  # Build the TanStack Start server for Netlify instead of the Cloudflare default.
  NITRO_PRESET = "netlify"
